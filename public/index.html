<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaki Planner</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ee; --accent:#3b5bdb; --good:#2b8a3e; --goodbg:#e6f6ea; --bad:#c92a2a; --badbg:#fde8e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1b1f29; --ink:#e7eaf2; --muted:#98a0b3; --line:#2c3240; --accent:#748ffc; --good:#69db7c; --goodbg:#16301e; --bad:#ff8787; --badbg:#3a1a1a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; cursor:pointer; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:17px; margin:0 0 12px; } h3 { font-size:15px; margin:16px 0 8px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  input, select { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; width:100%; }
  input[type=checkbox] { width:auto; }
  button { font:inherit; border:0; border-radius:6px; padding:8px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--line); padding:4px 8px; font-size:13px; }
  button:disabled { opacity:.55; cursor:progress; }
  .row { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--bad); min-height:1.2em; font-size:14px; }
  .checks { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .checks label { display:flex; gap:6px; align-items:center; color:var(--ink); font-size:14px; margin:0; }
  .list a { display:block; padding:10px 0; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; }
  .list a:last-child { border:0; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:var(--bg); border:1px solid var(--line); }
  .best { background:var(--goodbg); border-color:transparent; color:var(--good); padding:12px; border-radius:8px; font-weight:600; }
  .best.tentative { background:var(--bg); border:1px solid var(--line); color:var(--ink); }
  .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .cal.busy { opacity:.7; cursor:progress; }
  .cal.busy .day { cursor:progress; }
  .cal .dow { font-size:12px; color:var(--muted); text-align:center; }
  .day { border:1px solid var(--line); border-radius:6px; padding:4px; min-height:48px; cursor:pointer; font-size:13px; user-select:none; background:var(--card); }
  .day.past { opacity:.4; }
  .day.mine { background:var(--badbg); border-color:var(--bad); }
  .day.pick { outline:2px solid var(--good); }
  .day .n { font-weight:600; } .day .x { font-size:11px; color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pos { color:var(--good); } .neg { color:var(--bad); }
  .me { font-weight:600; }
  .auth { max-width:360px; margin:40px auto; }
</style>
</head>
<body>
<header><h1 onclick="go('')">Kaki Planner</h1><span id="who" class="muted"></span><button id="logout" class="ghost" hidden>Log out</button></header>
<main id="app"></main>

<script>
let me = null, users = [];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
// Uses the currency's own decimals (JPY 1,500, SGD 12.50). Codes keep SGD and USD apart where symbols wouldn't.
const money = (n, cur) => {
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, currencyDisplay: 'code' }).format(n); }
  catch { return `${esc(cur)} ${Number(n).toFixed(2)}`; }
};
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const today = () => new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
const nameOf = id => (users.find(u => u.id === id) || {}).username || '?';

async function api(path, opts = {}) {
  let res;
  try { res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json' }, body: opts.body && JSON.stringify(opts.body) }); }
  catch { throw new Error("Couldn't reach the server. Check your connection and try again."); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && me) { me = null; route(); }
  if (!res.ok) throw Object.assign(new Error(data.error || 'Something went wrong'), { status: res.status });
  return data;
}
// Disables the button (or every button in a form) while fn runs, so a second tap can't send the request twice.
async function busy(el, fn) {
  const btns = el.tagName === 'FORM' ? [...el.querySelectorAll('button')] : [el];
  btns.forEach(b => b.disabled = true);
  try { return await fn(); } finally { btns.forEach(b => b.disabled = false); }
}
const loadError = (msg, back) => `<div class="card"><p class="err">${esc(msg)}</p>
  <button onclick="this.disabled = true; route()">Retry</button>${back ? ` <button class="ghost" onclick="go('')">Back</button>` : ''}</div>`;
const go = hash => { location.hash = hash; };
window.addEventListener('hashchange', route);
$('#logout').onclick = () => busy($('#logout'), async () => {
  try { await api('/api/logout', { method: 'POST' }); me = null; go(''); route(); }
  catch (e) { alert(e.message); }
});

async function route() {
  if (!me) {
    try { me = await api('/api/me'); }
    catch (e) { if (e.status !== 401) { $('#app').innerHTML = loadError(e.message); return; } me = null; }
  }
  $('#who').textContent = me ? `Hi, ${me.username}` : '';
  $('#logout').hidden = !me;
  if (!me) return renderAuth();
  try {
    users = await api('/api/users');
    const m = location.hash.match(/^#event\/(\d+)$/);
    await (m ? renderEvent(Number(m[1])) : renderHome());
  } catch (e) { $('#app').innerHTML = loadError(e.message); }
}

// ---------- login / sign up ----------
function renderAuth() {
  $('#app').innerHTML = `
    <div class="card auth">
      <h2>Log in or sign up</h2>
      <form id="f">
        <label>Username</label><input name="username" autocomplete="username" required>
        <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
        <p class="err" id="e"></p>
        <button name="login">Log in</button> <button name="register" class="ghost">Sign up</button>
      </form>
    </div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const action = ev.submitter?.name === 'register' ? 'register' : 'login';
    $('#e').textContent = '';
    await busy(ev.target, async () => {
      try { me = await api('/api/' + action, { method: 'POST', body: { username: f.get('username'), password: f.get('password') } }); route(); }
      catch (e) { $('#e').textContent = e.message; }
    });
  };
}

// ---------- event list + create ----------
async function renderHome() {
  const events = await api('/api/events');
  const t = today();
  $('#app').innerHTML = `
    <div class="card">
      <h2>Your events</h2>
      <div class="list">${events.length ? events.map(e => `
        <a href="#event/${e.id}"><b>${esc(e.title)}</b>
          <span class="pill">${e.length === 1 ? '1 day' : e.length + ' days'}</span>
          <div class="muted">${fmtDate(e.start_date)} – ${fmtDate(e.end_date)} · ${e.member_count} people · ${esc(e.currency)}</div></a>`).join('')
        : '<p class="muted">No events yet. Create one below.</p>'}</div>
    </div>
    <div class="card">
      <h2>New event</h2>
      <form id="f">
        <label>Title</label><input name="title" placeholder="Japan trip / Sentosa day out" required>
        <div class="row">
          <div><label>Window from</label><input name="start" type="date" value="${t}" required></div>
          <div><label>Window to</label><input name="end" type="date" value="${addDays(t, 60)}" required></div>
          <div><label>Length (days)</label><input name="length" type="number" min="1" value="1" required></div>
          <div><label>Main currency</label><input name="currency" value="SGD" maxlength="3" required></div>
        </div>
        <label>Who's invited</label>
        <div class="checks">${users.map(u => `<label><input type="checkbox" name="m" value="${u.id}" checked ${u.id === me.id ? 'disabled' : ''}> ${esc(u.username)}</label>`).join('')}</div>
        <p class="err" id="e"></p>
        <button>Create event</button>
      </form>
      <p class="muted">Friends need to sign up first to appear in the invite list.</p>
    </div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    $('#e').textContent = '';
    await busy(ev.target, async () => {
      try {
        const { id } = await api('/api/events', { method: 'POST', body: {
          title: f.get('title'), start: f.get('start'), end: f.get('end'), length: Number(f.get('length')),
          currency: f.get('currency'), members: f.getAll('m').map(Number) } });
        go('event/' + id);
      } catch (e) { $('#e').textContent = e.message; }
    });
  };
}

// ---------- event detail ----------
let detail = null, focusDay = null, calSaving = false;
async function renderEvent(id) {
  try { detail = await api('/api/events/' + id); } catch (e) { $('#app').innerHTML = loadError(e.message, true); return; }
  focusDay = null;
  drawEvent();
}

function drawEvent() {
  const { event: ev, members, unavailable, responded, suggestions, expenses, balances, transfers } = detail;
  const best = suggestions[0];
  const mineSet = new Set(unavailable.filter(u => u.user_id === me.id).map(u => u.day));
  const othersBy = {};
  for (const u of unavailable) if (u.user_id !== me.id) (othersBy[u.day] ||= []).push(u.user_id);
  const inBest = d => best && d >= best.start && d <= best.end;
  // Until everyone has responded, a day with no clashes may just mean people haven't looked yet.
  const respondedSet = new Set(responded);
  const waiting = members.filter(m => !respondedSet.has(m.id)).map(m => m.id === me.id ? 'you' : m.username);
  const dayInfo = (d, mine) => {
    const out = [...(mine.has(d) ? ['you'] : []), ...(othersBy[d] || []).map(nameOf)];
    return `<b>${fmtDate(d)}</b>: ${out.length ? "can't make it: " + esc(out.join(', ')) : 'no one has marked this day'}`;
  };

  // Calendar: pad to Monday start
  const first = new Date(ev.start_date + 'T00:00:00Z');
  const pad = (first.getUTCDay() + 6) % 7;
  let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('') + '<div></div>'.repeat(pad);
  const t = today();
  for (let d = ev.start_date; d <= ev.end_date; d = addDays(d, 1)) {
    const others = othersBy[d] || [];
    const dt = new Date(d + 'T00:00:00Z');
    const label = dt.getUTCDate() === 1 || d === ev.start_date ? dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short', timeZone: 'UTC' }) : dt.getUTCDate();
    cells += `<div class="day ${mineSet.has(d) ? 'mine' : ''} ${inBest(d) ? 'pick' : ''} ${d < t ? 'past' : ''}" data-day="${d}"
      title="${others.length ? 'Can\'t: ' + esc(others.map(nameOf).join(', ')) : 'No clashes from others'}">
      <div class="n">${label}</div>${others.length ? `<div class="x">✕ ${others.length}</div>` : ''}</div>`;
  }

  const clashCount = n => n ? `${n} ${n === 1 ? 'clash' : 'clashes'}` : waiting.length ? 'no clashes yet' : 'all free';
  const suggestText = !best ? '<p class="muted">No dates left in this window.</p>' : `
    <div class="best ${waiting.length ? 'tentative' : ''}">${waiting.length ? 'Best so far' : best.clashes.length ? 'Best option' : 'Everyone can make it'}: ${fmtDate(best.start)}${ev.length > 1 ? ' – ' + fmtDate(best.end) : ''}
      ${best.clashes.length ? `<div class="muted">Can't make it: ${esc(best.clashes.map(nameOf).join(', '))}</div>` : ''}</div>
    ${waiting.length ? `<p class="muted">Waiting on: ${esc(waiting.join(', '))}</p>` : ''}
    ${suggestions.length > 1 ? `<p class="muted">Other options: ${suggestions.slice(1).map(s => `${fmtDate(s.start)}${ev.length > 1 ? ' – ' + fmtDate(s.end) : ''} (${clashCount(s.clashes.length)})`).join(' · ')}</p>` : ''}`;

  const lastRate = cur => (expenses.find(e => e.currency === cur) || {}).rate || '';
  const myBal = balances[me.id] || 0;
  const square = Math.abs(myBal) < 0.005;

  $('#app').innerHTML = `
    <p><a href="#" onclick="go('');return false">← All events</a></p>
    <div class="card">
      <h2>${esc(ev.title)} <span class="pill">${ev.length === 1 ? '1 day' : ev.length + ' days'}</span></h2>
      <div class="muted">Window ${fmtDate(ev.start_date)} – ${fmtDate(ev.end_date)} · ${members.map(m => esc(m.username)).join(', ')}</div>
      <h3>Suggested date</h3>${suggestText}
      <h3>Days you can't make it</h3>
      <p class="muted">Tap days to mark them red. ✕ shows how many others can't make it; the day you tap shows their names below. Green outline is the suggestion.</p>
      <div class="cal" id="cal">${cells}</div>
      <p class="muted" id="dayInfo">${focusDay ? dayInfo(focusDay, mineSet) : ''}</p>
      ${respondedSet.has(me.id) ? '' : `<p><button class="ghost" id="allFree">I'm free on all days</button></p>`}
      <p class="err" id="calErr"></p>
      ${ev.created_by === me.id ? '<button class="danger" id="delEv">Delete event</button>' : ''}
    </div>

    <div class="card">
      <h2>Spending</h2>
      <p>Your balance: ${square ? '<b>All square</b>' : `<b class="${myBal > 0 ? 'pos' : 'neg'}">${myBal > 0 ? 'you are owed ' : 'you owe '}${money(Math.abs(myBal), ev.currency)}</b>`}</p>
      <h3>Settle up</h3>
      ${transfers.length ? `<table>${transfers.map(t => `<tr class="${t.from === me.id || t.to === me.id ? 'me' : ''}"><td>${esc(nameOf(t.from))} pays ${esc(nameOf(t.to))}</td><td>${money(t.amount, ev.currency)}</td></tr>`).join('')}</table>` : '<p class="muted">All square.</p>'}

      <h3>Add an expense</h3>
      <form id="xf">
        <div class="row">
          <div><label>Item</label><input name="item" placeholder="Dinner, hotel…" required></div>
          <div><label>Amount</label><input name="amount" type="number" step="0.01" min="0.01" required></div>
          <div><label>Currency</label><input name="currency" value="${esc(ev.currency)}" maxlength="3" required></div>
          <div id="rateBox" hidden><label id="rateLabel">Rate</label><input name="rate" type="number" step="any" min="0" max="1000000"><div class="muted" id="ratePreview"></div></div>
          <div><label>Paid by</label><select name="paidBy">${members.map(m => `<option value="${m.id}" ${m.id === me.id ? 'selected' : ''}>${esc(m.username)}</option>`).join('')}</select></div>
        </div>
        <label>Split equally between</label>
        <div class="checks">${members.map(m => `<label><input type="checkbox" name="s" value="${m.id}" checked> ${esc(m.username)}</label>`).join('')}</div>
        <p class="err" id="xe"></p>
        <button>Add expense</button>
      </form>

      <h3>All expenses</h3>
      <p class="err" id="de"></p>
      ${expenses.length ? `<table><tr><th>Item</th><th>Amount</th><th>Paid by</th><th>Split</th><th></th></tr>${expenses.map(e => `
        <tr><td>${esc(e.item)}<div class="muted">${new Date(e.created_at).toLocaleDateString()}</div></td>
          <td>${money(e.amount, e.currency)}${e.currency !== ev.currency ? `<div class="muted">≈ ${money(e.amount * e.rate, ev.currency)}</div>` : ''}</td>
          <td>${esc(nameOf(e.paid_by))}</td>
          <td>${e.shares.length === members.length ? 'Everyone' : esc(e.shares.map(nameOf).join(', '))}</td>
          <td>${e.created_by === me.id || ev.created_by === me.id ? `<button class="danger" data-del="${e.id}">Delete</button>` : ''}</td></tr>`).join('')}</table>`
        : '<p class="muted">Nothing spent yet.</p>'}
    </div>`;

  // Availability: toggle and save immediately. One save at a time, so saves can't land out of order.
  $('#cal').onclick = async e => {
    const cell = e.target.closest('.day');
    if (!cell || calSaving) return;
    const d = cell.dataset.day;
    const days = new Set(mineSet);
    days.has(d) ? days.delete(d) : days.add(d);
    focusDay = d;
    cell.classList.toggle('mine');
    $('#dayInfo').innerHTML = dayInfo(d, days);
    $('#calErr').textContent = '';
    calSaving = true;
    $('#cal').classList.add('busy');
    try { detail = await api(`/api/events/${ev.id}/unavailable`, { method: 'PUT', body: { days: [...days] } }); }
    catch (err) {
      cell.classList.toggle('mine');
      $('#dayInfo').innerHTML = dayInfo(d, mineSet);
      $('#calErr').textContent = "Couldn't save: " + err.message;
      return;
    } finally { calSaving = false; $('#cal').classList.remove('busy'); }
    drawEvent();
  };
  if ($('#allFree')) $('#allFree').onclick = () => busy($('#allFree'), async () => {
    $('#calErr').textContent = '';
    try { detail = await api(`/api/events/${ev.id}/unavailable`, { method: 'PUT', body: { days: [] } }); drawEvent(); }
    catch (err) { $('#calErr').textContent = "Couldn't save: " + err.message; }
  });
  if ($('#delEv')) $('#delEv').onclick = async () => {
    if (!confirm('Delete this event and all its expenses?')) return;
    $('#calErr').textContent = '';
    await busy($('#delEv'), async () => {
      try { await api('/api/events/' + ev.id, { method: 'DELETE' }); go(''); }
      catch (err) { $('#calErr').textContent = "Couldn't delete: " + err.message; }
    });
  };

  // Expenses
  const xf = $('#xf');
  let rateCur = null; // the currency the rate field was last filled for
  const syncRate = () => {
    const cur = xf.currency.value.trim().toUpperCase();
    const foreign = cur.length === 3 && cur !== ev.currency;
    $('#rateBox').hidden = !foreign;
    xf.rate.required = foreign;
    if (foreign) {
      $('#rateLabel').textContent = `1 ${cur} = ? ${ev.currency}`;
      // A rate typed for one currency is wrong for another, so refill it whenever the currency changes.
      if (cur !== rateCur) { xf.rate.value = lastRate(cur); rateCur = cur; }
    }
    const converted = Number(xf.amount.value) * Number(xf.rate.value);
    $('#ratePreview').textContent = foreign && converted > 0 && Number.isFinite(converted) ? `≈ ${money(converted, ev.currency)}` : '';
  };
  xf.currency.oninput = xf.amount.oninput = xf.rate.oninput = syncRate;
  xf.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(xf);
    $('#xe').textContent = '';
    await busy(xf, async () => {
      try {
        detail = await api(`/api/events/${ev.id}/expenses`, { method: 'POST', body: {
          item: f.get('item'), amount: Number(f.get('amount')), currency: f.get('currency'), rate: Number(f.get('rate')),
          paidBy: Number(f.get('paidBy')), splitWith: f.getAll('s').map(Number) } });
        drawEvent();
      } catch (err) { $('#xe').textContent = err.message; }
    });
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this expense?')) return;
    $('#de').textContent = '';
    await busy(b, async () => {
      try { detail = await api('/api/expenses/' + b.dataset.del, { method: 'DELETE' }); drawEvent(); }
      catch (err) { $('#de').textContent = "Couldn't delete: " + err.message; }
    });
  });
}

route();
</script>
</body>
</html>
